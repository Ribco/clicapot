<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clicapot — Settings</title>
<link rel="stylesheet" href="/static/css/clicapot.css">
  <script src="/static/js/theme.js"></script>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/android-chrome-512x512.png">

</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="/static/logo.png" alt="Clicapot" class="brand-logo"></div>

    <nav>
      <a href="/dashboard">Overview</a>
      <a href="/websites">Websites</a>
      <a href="/dns">DNS</a>
      <a href="/security">Security</a>
      <a href="/analytics">Analytics</a>

      <div class="nav-label">Developer</div>
      <a href="/workers">Workers</a>
      <a href="/pages">Pages</a>
      <a href="/storage">Storage</a>
      <a href="/kv">KV</a>
      <a href="/tunnels">Tunnels</a>

      <div class="nav-label">Account</div>
      <a href="/api-keys">API Keys</a>
      <a class="active" href="/settings">Settings</a>
    </nav>

    <button id="logout" class="logout">Sign out</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button id="menu" class="menu">☰</button>
      <div>
        <div class="eyebrow">Clicapot</div>
        <h2>Settings</h2>
      </div>
    </header>

    <section class="content">
      <div class="hero">
        <div class="eyebrow">Account</div>
        <h1>Settings</h1>
        <p class="muted">Customize your Clicapot experience.</p>
      </div>

      <div class="settings-grid">
        <section class="panel">
          <div class="panel-head">
            <h3>Appearance</h3>
            <p class="muted">Choose how Clicapot looks.</p>
          </div>

          <div class="setting-row">
            <div>
              <strong>Theme</strong>
              <p class="muted">Switch between light and dark mode.</p>
            </div>

            <div class="theme-buttons">
              <button class="theme-btn" data-theme="light">☀ Light</button>
              <button class="theme-btn" data-theme="dark">☾ Dark</button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
</div>

<script src="/static/js/settings.js"></script>
</body>
</html>
